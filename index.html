<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>niq</title>

    <!-- Open Graph -->
    <meta property="og:title" content="niq" />
    <meta property="og:description"
        content="Your digital agent behind the screen. Running programs that haven't been written yet." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://niq.run" />
    <meta property="og:image" content="https://niq.run/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="niq" />
    <meta name="twitter:description"
        content="Your digital agent behind the screen. Running programs that haven't been written yet." />
    <meta name="twitter:image" content="https://niq.run/og-image.jpg" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            /* Same stack as the webui sidebar logo */
            font-family: "SomeType Mono", "Fira Mono", "PT Mono", monospace;
            /* niq theme blue — same as the webui logo fill (#3C78B4) */
            background: rgb(60, 120, 180);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-x pan-y;
        }

        .scene {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .center-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(12px, 2.5vw, 36px);
            z-index: 2;
            padding: 20px;
        }

        .letters-container {
            display: flex;
            position: relative;
            font-size: 20vw;
            font-weight: 700;
            letter-spacing: 0.05em;
            user-select: none;
            transform: scaleX(-1);
        }

        .letter {
            display: inline-block;
            position: relative;
            color: #ffffff;
        }

        .slogan {
            font-size: clamp(10px, 1.2vw, 18px);
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #ddd;
            text-align: center;
            line-height: 1.6;
            white-space: nowrap;
            user-select: none;
        }

        /* 主字下方文字区：slogan 与 github 之间用比主间距更小的间距 */
        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(10px, 1.6vw, 20px);
        }

        .github {
            font-size: clamp(15px, 1.9vw, 28px);
            letter-spacing: 0.15em;
            color: #ddd;
            text-decoration: none;
            user-select: none;
            transition: color 0.2s ease;
            margin-top: 20px;
        }

        .github:hover {
            color: #ffffff;
            /* text-decoration: underline; */
        }

        .github:focus-visible {
            outline: 1px dotted rgba(255, 255, 255, 0.7);
            outline-offset: 4px;
        }

        /* 响应式：平板 */
        @media (max-width: 768px) {
            .center-group {
                gap: 3vw;
            }

            .letters-container {
                font-size: 24vw;
            }

            .slogan {
                font-size: clamp(11px, 2.2vw, 16px);
                white-space: normal;
                max-width: 85vw;
            }

            .github {
                font-size: clamp(14px, 3.2vw, 22px);
            }
        }

        /* 响应式：手机 */
        @media (max-width: 480px) {
            .letters-container {
                font-size: 28vw;
            }

            .slogan {
                font-size: clamp(10px, 3vw, 14px);
                white-space: normal;
                max-width: 88vw;
                letter-spacing: 0.12em;
            }

            .github {
                font-size: clamp(13px, 4.2vw, 18px);
                letter-spacing: 0.12em;
            }
        }

        /* 超小屏手机（iPhone SE 等） */
        @media (max-width: 374px) {
            .letters-container {
                font-size: 24vw;
            }

            .slogan {
                font-size: clamp(9px, 3.2vw, 12px);
                max-width: 92vw;
            }

            .github {
                font-size: clamp(12px, 4.4vw, 16px);
            }
        }

        /* 横屏手机：降低主字高度占用，避免挡住 slogan */
        @media (max-height: 500px) {
            .letters-container {
                font-size: 14vh;
            }

            .center-group {
                gap: 8px;
            }

            .slogan {
                font-size: clamp(8px, 2vh, 12px);
            }

            .github {
                font-size: clamp(11px, 3vh, 18px);
            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="center-group">
            <div class="letters-container">
                <span class="letter">p</span>
                <span class="letter">i</span>
                <span class="letter">n</span>
            </div>
            <div class="footer">
                <div class="slogan">
                    Your digital agent behind the screen<br />
                    Running programs that haven't been written yet
                </div>
                <a class="github" href="https://github.com/niq-run/niq" target="_blank"
                    rel="noopener noreferrer">github.com/niq-run/niq</a>
            </div>
        </div>
    </div>
</body>

</html>
