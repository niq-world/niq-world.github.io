<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>niq</title>

        <!-- Open Graph -->
        <meta property="og:title" content="niq" />
        <meta
            property="og:description"
            content="Your digital agent behind the screen. Running programs that haven't been written yet."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://niq.run" />
        <meta property="og:image" content="https://niq.run/og-image.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:locale" content="zh_CN" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="niq" />
        <meta
            name="twitter:description"
            content="Your digital agent behind the screen. Running programs that haven't been written yet."
        />
        <meta name="twitter:image" content="https://niq.run/og-image.jpg" />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }

            body {
                font-family: Monaco, "Andale Mono", Menlo, "PT Mono", monospace;
                background: #0d0015;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                -webkit-text-size-adjust: 100%;
                -webkit-tap-highlight-color: transparent;
                touch-action: pan-x pan-y;
            }

            .scene {
                position: fixed;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                padding: env(safe-area-inset-top) env(safe-area-inset-right)
                    env(safe-area-inset-bottom) env(safe-area-inset-left);
            }

            /* 背景：深色紫底 + 微妙径向光晕 */
            .scene::before {
                content: "";
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(
                        circle at 50% 50%,
                        rgba(160, 50, 255, 0.08) 0%,
                        transparent 60%
                    ),
                    radial-gradient(
                        circle at 20% 30%,
                        rgba(100, 0, 200, 0.05) 0%,
                        transparent 40%
                    ),
                    radial-gradient(
                        circle at 80% 70%,
                        rgba(80, 0, 180, 0.04) 0%,
                        transparent 40%
                    );
                pointer-events: none;
            }

            .center-group {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: clamp(12px, 2.5vw, 36px);
                z-index: 2;
                padding: 20px;
            }

            .letters-container {
                display: flex;
                position: relative;
                font-size: 20vw;
                font-weight: 700;
                letter-spacing: 0.05em;
                user-select: none;
                transform: scaleX(-1);
            }

            .letter {
                display: inline-block;
                position: relative;
                color: #c084fc;
                text-shadow:
                    0 0 7px rgba(192, 132, 252, 0.8),
                    0 0 14px rgba(192, 132, 252, 0.6),
                    0 0 28px rgba(160, 50, 255, 0.4),
                    0 0 56px rgba(160, 50, 255, 0.25),
                    0 0 90px rgba(120, 0, 220, 0.15);
                transition: text-shadow 0.3s ease;
            }

            /* 每个字母微妙的颜色深浅变化，增加层次感 */
            .letter:nth-child(1) {
                color: #d8a0ff;
                text-shadow:
                    0 0 7px rgba(216, 160, 255, 0.8),
                    0 0 14px rgba(216, 160, 255, 0.6),
                    0 0 28px rgba(180, 80, 255, 0.4),
                    0 0 56px rgba(160, 50, 255, 0.25),
                    0 0 90px rgba(120, 0, 220, 0.15);
            }

            .letter:nth-child(2) {
                color: #b070f0;
                text-shadow:
                    0 0 7px rgba(176, 112, 240, 0.9),
                    0 0 14px rgba(176, 112, 240, 0.6),
                    0 0 28px rgba(140, 40, 230, 0.45),
                    0 0 56px rgba(120, 20, 200, 0.3),
                    0 0 90px rgba(100, 0, 180, 0.2);
            }

            .letter:nth-child(3) {
                color: #e8b8ff;
                text-shadow:
                    0 0 7px rgba(232, 184, 255, 0.8),
                    0 0 14px rgba(232, 184, 255, 0.5),
                    0 0 28px rgba(200, 120, 255, 0.35),
                    0 0 56px rgba(160, 50, 255, 0.2),
                    0 0 90px rgba(120, 0, 220, 0.12);
            }

            .slogan {
                font-size: clamp(10px, 1.2vw, 18px);
                font-weight: 400;
                letter-spacing: 0.15em;
                color: rgba(227, 217, 238, 0.62);
                text-shadow:
                    0 0 6px rgba(160, 50, 255, 0.15),
                    0 0 16px rgba(120, 0, 220, 0.06);
                text-align: center;
                line-height: 1.6;
                white-space: nowrap;
                user-select: none;
            }

            /* 响应式：平板 */
            @media (max-width: 768px) {
                .center-group {
                    gap: 3vw;
                }
                .letters-container {
                    font-size: 24vw;
                }
                .slogan {
                    font-size: clamp(11px, 2.2vw, 16px);
                    white-space: normal;
                    max-width: 85vw;
                }
            }

            /* 响应式：手机 */
            @media (max-width: 480px) {
                .letters-container {
                    font-size: 28vw;
                }
                .slogan {
                    font-size: clamp(10px, 3vw, 14px);
                    white-space: normal;
                    max-width: 88vw;
                    letter-spacing: 0.12em;
                }
            }

            /* 超小屏手机（iPhone SE 等） */
            @media (max-width: 374px) {
                .letters-container {
                    font-size: 24vw;
                }
                .slogan {
                    font-size: clamp(9px, 3.2vw, 12px);
                    max-width: 92vw;
                }
            }

            /* 横屏手机：降低主字高度占用，避免挡住 slogan */
            @media (max-height: 500px) {
                .letters-container {
                    font-size: 14vh;
                }
                .center-group {
                    gap: 8px;
                }
                .slogan {
                    font-size: clamp(8px, 2vh, 12px);
                }
            }
        </style>
    </head>
    <body>
        <div class="scene">
            <div class="center-group">
                <div class="letters-container">
                    <span class="letter">p</span>
                    <span class="letter">i</span>
                    <span class="letter">n</span>
                </div>
                <div class="slogan">
                    Your digital agent behind the screen<br />
                    Running programs that haven't been written yet
                </div>
            </div>
        </div>
    </body>
</html>
